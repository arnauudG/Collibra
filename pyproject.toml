[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collibra-toolkit"
version = "0.2.0"
description = "Reusable Collibra tooling: a generic REST client plus initiative packages (Insights Data Access first)."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyarrow>=15"]

[project.scripts]
collibra-toolkit = "collibra_toolkit.cli:main"
collibra-insights = "collibra_toolkit.insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["collibra_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
