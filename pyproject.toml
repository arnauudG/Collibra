[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collibra-insights"
version = "0.1.0"
description = "Small client for Collibra's Insights Data Access snapshots, with a local DuckDB explorer."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyarrow>=15"]

[project.scripts]
collibra-insights = "collibra_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
